apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP     # internal only. The Ingress is what exposes it outside.
  selector:
    app: api          # send traffic to any pod carrying this label
  ports:
    - name: http
      port: 8080      # the address others call:  http://api:8080
      targetPort: 8080  # the port on the container
