# ---------------------------------------------------------------------------
# A Service gives you ONE stable address in front of many changing pods.
#
# The pods behind it come and go with new names and new IPs. The Service's
# own IP and DNS name never change for its entire lifetime.
# ---------------------------------------------------------------------------

apiVersion: v1
# Note: just "v1", not "apps/v1". Services are in the core API group
# (older than Deployments, which live in "apps").

kind: Service

metadata:
  name: web
  # ⚠️ THIS NAME BECOMES THE DNS NAME.
  # Any pod in this namespace can now reach it at:  http://web
  # From another namespace:                          http://web.default
  # Fully qualified:                    http://web.default.svc.cluster.local

spec:
  type: ClusterIP
  # ClusterIP = reachable only from INSIDE the cluster. This is the default
  # and the right choice for almost everything.
  #
  # The other types, for later:
  #   NodePort     — opens a high port (30000-32767) on every node. Clunky.
  #   LoadBalancer — asks the cloud for a real load balancer. Costs money,
  #                  and does nothing on kind (stays <pending> forever).
  #
  # For HTTP from outside you almost never use those. You use ONE Ingress
  # in front of many ClusterIP Services — same shape as AceArena, where one
  # ALB fronted twelve target groups.

  selector:
    app: web
  # ⚠️ THE ENTIRE MECHANISM IS THIS.
  # "Send traffic to any pod labelled app=web."
  #
  # It does not know pod names. It does not know pod IPs. It runs a live
  # query against the API server, and the matching set updates itself as
  # pods are created and destroyed.
  #
  # This selector is matched against POD labels — the ones in the Deployment's
  # template.metadata.labels. Not the Deployment's own labels.

  ports:
    - name: http
      port: 80
      # The port the SERVICE listens on. What callers connect to: http://web:80

      targetPort: 80
      # The port on the POD to forward to. What your container actually listens on.
      #
      # These two are separate on purpose. You could expose port 80 on the
      # Service and forward to 8080 in the container. Very common with .NET,
      # which often listens on 8080 as a non-root user.

      protocol: TCP
