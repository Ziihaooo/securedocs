apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api          # which pods this Deployment owns
  template:             # the blueprint for every pod it creates
    metadata:
      labels:
        app: api        # must match the selector above, or nothing is owned
    spec:
      # Runs to completion BEFORE the api container starts. If it exits non-zero
      # Kubernetes retries it, and the api never starts. Turns a CrashLoopBackOff
      # (with exponential backoff up to 5 minutes) into an orderly wait.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          # pg_isready, not "nc -z". A port being open only proves something is
          # listening; pg_isready proves Postgres is actually accepting queries.
          # During startup Postgres opens the port well before it can serve.
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "postgres not ready, retrying in 2s"
                sleep 2
              done
              echo "postgres is ready"
          envFrom:
            - secretRef:
                name: postgres-credentials

      containers:
        - name: api
          image: securedocs-api:dev
          # Default for a non-":latest" tag is IfNotPresent, which uses the
          # image kind loaded onto the node. Stated explicitly so it doesn't
          # silently change if the tag ever becomes :latest.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          env:
            # Pulled individually (not envFrom) because $(VAR) expansion below
            # only works with variables declared here, and only ones declared
            # ABOVE the line that uses them.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB

            # Double underscore is .NET's separator for nested config, so this
            # env var becomes ConnectionStrings:Default — exactly what
            # builder.Configuration.GetConnectionString("Default") reads.
            #
            # "postgres" is the headless Service name; DNS resolves it in-cluster.
            - name: ConnectionStrings__Default
              value: Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)

          # ── RESOURCES ────────────────────────────────────────────────────
          # requests = what the SCHEDULER reserves. It only places this pod on a
          #            node with this much free. Sum of requests, not usage,
          #            decides whether a node is "full".
          # limits   = the hard ceiling enforced by the kernel at runtime.
          #
          #   over CPU limit    -> throttled. Slow, still alive.
          #   over memory limit -> OOMKilled. Killed instantly, no warning.
          #
          # CPU is compressible (you can have less). Memory is not — there is no
          # "slightly less RAM", so the kernel kills the process instead.
          #
          # requests < limits here = QoS class "Burstable": can use spare node
          # capacity when it's free, but is evicted before Guaranteed pods when
          # the node runs short.
          resources:
            requests:
              cpu: 50m        # 0.05 of a core — enough to idle and serve health checks
              memory: 128Mi   # .NET needs real memory even when idle
            limits:
              cpu: 500m       # burst to half a core under load
              memory: 256Mi   # exceeding this = OOMKilled (Day 7 demo)

          # ── STARTUP: "have you finished booting?" ─────────────────────────
          # While this is failing, the other two probes are SUSPENDED. That is
          # the whole point: a slow .NET cold start can't be mistaken for a hang.
          # Budget = periodSeconds x failureThreshold = 2 x 30 = 60s to start.
          # Exceed that and the container is killed and retried.
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            periodSeconds: 2
            failureThreshold: 30

          # ── LIVENESS: "are you wedged? restart me" ────────────────────────
          # No initialDelaySeconds needed — startupProbe already gates this.
          # 3 failures x 10s = ~30s of being unresponsive before a restart.
          # Too aggressive here and you restart pods that were merely busy.
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # ── READINESS: "can you serve traffic right now?" ─────────────────
          # Checks Postgres. Failing removes the pod from the Service endpoints
          # WITHOUT restarting it. Tighter thresholds than liveness because the
          # consequence is mild and reversible — we want traffic pulled quickly.
          # successThreshold: 1 means it rejoins as soon as one check passes.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          # Probes: Day 5. Endpoints already exist (/healthz/startup|live|ready).
          # Resource requests/limits: Day 5.
