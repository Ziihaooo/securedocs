# ---------------------------------------------------------------------------
# The Ingress is the OUTSIDE door.
#
#   browser :8080  →  node :80  →  ingress controller  →  Service  →  Pod
#
# Remember: this object is only DATA. The ingress-nginx controller pod reads
# it and reconfigures itself. Delete the controller and this file does nothing.
# ---------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
# Another API group. Deployments = apps/v1, Services = v1, Ingress = networking.k8s.io/v1.
# There's no logic to remember here — `kubectl explain ingress` tells you.

kind: Ingress

metadata:
  name: web

spec:
  ingressClassName: nginx
  # WHICH controller should handle this rule.
  # A cluster can run several (nginx, traefik, an AWS ALB controller...).
  # Omit this and no controller may claim it — your Ingress silently does
  # nothing. A very common "why isn't this working" cause.

  rules:
    - http:
        # No `host:` here, so this matches ANY hostname — fine for localhost.
        # In production you'd write:
        #   - host: securedocs.example.com
        # and the controller would route by the Host header, letting one
        # controller serve many sites. Same idea as an ALB listener rule
        # matching on host or path.

        paths:
          - path: /
            pathType: Prefix
            # Prefix — "/" matches everything.
            #
            # pathType options:
            #   Prefix                 /api matches /api, /api/, /api/users
            #   Exact                  /api matches ONLY /api
            #   ImplementationSpecific leaves it to the controller (avoid)

            backend:
              service:
                name: web
                # Which SERVICE to forward to — not a pod. The Ingress hands off
                # to the Service, which load balances across the pods.

                port:
                  number: 80
                  # The SERVICE's port (spec.ports[].port), not the container's.

# ---------------------------------------------------------------------------
# The full chain, and why each layer exists:
#
#   Ingress    routes by hostname/path      →  one entry point, many apps
#   Service    stable address + balancing   →  pods change IP constantly
#   Pod        the actual container
#
# AceArena had exactly this shape:
#   ALB + listener rules  ≈  Ingress
#   Target group          ≈  Service
#   ECS task              ≈  Pod
# ---------------------------------------------------------------------------
