apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    # Strip the /api prefix before forwarding.
    #   browser asks for   /api/healthz/ready
    #   the app receives   /healthz/ready
    #
    # $2 is the second capture group in the path regex below. Without this the
    # app gets /api/healthz/ready, has no route for it, and returns 404.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /api(/|$)(.*)  →  group 1 = "/" or end, group 2 = everything after
          #   /api          → group2 = ""
          #   /api/         → group2 = ""
          #   /api/healthz  → group2 = "healthz"
          - path: /api(/|$)(.*)
            # ImplementationSpecific lets nginx treat this as a regex.
            # Prefix would match it literally and the capture groups wouldn't work.
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 8080
