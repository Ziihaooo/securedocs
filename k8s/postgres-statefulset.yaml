apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  # Points at the headless Service. This is what gives pods their DNS names:
  #   postgres-0.postgres.default.svc.cluster.local
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres

          # Every value comes from the Secret you created with kubectl.
          # envFrom pulls in ALL keys at once, so POSTGRES_USER, POSTGRES_PASSWORD
          # and POSTGRES_DB all appear as environment variables.
          envFrom:
            - secretRef:
                name: postgres-credentials

          env:
            # Postgres refuses to initialise into a directory that is not empty,
            # and a mounted volume often contains a lost+found entry. Pointing
            # PGDATA at a SUBDIRECTORY of the mount avoids that.
            # Without this you get: "directory exists but is not empty".
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          # ── RESOURCES ────────────────────────────────────────────────────
          # requests == limits, so QoS class is GUARANTEED: this pod is the LAST
          # thing evicted when a node runs out of memory. Correct for a database —
          # killing it loses connections and risks an unclean shutdown, while
          # killing a stateless api pod costs nothing.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m       # same as requests
              memory: 256Mi   # same as requests  -> Guaranteed
          # Note: an identical CPU limit means it can never burst. For a real
          # database you would raise both numbers rather than widen the gap —
          # predictability matters more than peak throughput here.

          # ── PROBES ───────────────────────────────────────────────────────
          # exec, not httpGet — Postgres speaks its own protocol, not HTTP.
          # pg_isready exits 0 only when the server is accepting connections.

          # Generous: initialising a fresh database (initdb) can take a while,
          # and restoring after an unclean shutdown longer still.
          # 5s x 24 = 120s budget.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "securedocs", "-d", "securedocs"]
            periodSeconds: 5
            failureThreshold: 24

          # Deliberately slow to fire. Restarting a database is expensive and
          # rarely the right fix — a busy server can miss a check without being
          # broken. 6 x 10s = a full minute unresponsive before a restart.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "securedocs", "-d", "securedocs"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # Faster: if Postgres can't answer, the api should stop being told
          # this endpoint is usable. No restart, so the cost of being wrong
          # is low.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "securedocs", "-d", "securedocs"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  # One PVC per pod, created automatically and named <template>-<pod>:
  #   postgres-0  ->  data-postgres-0
  # Deleting the StatefulSet does NOT delete these — deliberate, so you cannot
  # lose a database by deleting a workload.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce   # mountable by one node at a time
        resources:
          requests:
            storage: 1Gi
