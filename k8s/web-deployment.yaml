# ---------------------------------------------------------------------------
# Your first hand-written manifest.
# Everything above the "spec:" line describes WHO this object is.
# Everything below describes WHAT you want to exist.
# ---------------------------------------------------------------------------

apiVersion: apps/v1
# Which API group and version. Deployments live in the "apps" group.
# Pods and Services are in the core group, written as just "v1".
# If you get "no matches for kind", this line is usually wrong.

kind: Deployment
# The type of object.

metadata:
  name: web
  # The Deployment's name. Must be unique within the namespace.

  labels:
    app: web
  # Labels ON THE DEPLOYMENT ITSELF. Purely for humans and for
  # `kubectl get deploy -l app=web`. These do NOT control which pods it owns.

spec:
  replicas: 2
  # How many pods you want. The ReplicaSet enforces this number.

  selector:
    matchLabels:
      app: web
  # ⚠️ THE #1 BEGINNER MISTAKE LIVES HERE.
  # This is the query the Deployment uses to find its pods.
  # It MUST match the labels in template.metadata.labels below.
  # If they don't match, the API server rejects the manifest outright.
  # It is also immutable — you cannot change it after creation.

  template:
    # Everything below is the POD TEMPLATE — the blueprint stamped out
    # for each replica. Note it has its own metadata and spec: a pod
    # definition nested inside the Deployment.
    #
    # Change ANYTHING in this template and the pod-template-hash changes,
    # which creates a new ReplicaSet and triggers a rolling update.

    metadata:
      labels:
        app: web
      # ⚠️ These are the labels applied to each POD.
      # Must match spec.selector.matchLabels above. This is the link.

    spec:
      containers:
        - name: nginx
          # Container name within the pod. Used by `kubectl logs <pod> -c nginx`
          # and by `kubectl set image deploy/web nginx=...`

          image: nginx:1.27
          # Pinned to a real version, not :latest.
          # :latest is unreproducible — you cannot tell what actually ran.
          # Your Kyverno policy in Week 3 will reject :latest outright.

          ports:
            - containerPort: 80
          # DOCUMENTATION ONLY. This does not open, publish or firewall anything.
          # The container listens on 80 whether you write this or not.
          # It exists so humans and tooling know what the container expects.
