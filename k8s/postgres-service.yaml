apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  # THE line that makes this headless. No virtual IP is allocated, and DNS
  # returns pod IPs directly instead of load-balancing across them.
  #
  # It gives every StatefulSet pod a permanent DNS name:
  #   postgres-0.postgres.default.svc.cluster.local
  #   └ pod    └ service └ ns
  clusterIP: None

  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
