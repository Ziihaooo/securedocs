apiVersion: batch/v1
kind: Job
metadata:
  name: migrator
  annotations:
    # ── This is what makes the ORDERING real under ArgoCD ──────────────────
    # PreSync: run this Job to completion BEFORE ArgoCD applies anything else
    # in the folder. The api Deployment does not roll out until this exits 0.
    #
    # Without it, ArgoCD applies every file at once and the api could start
    # against a schema that doesn't exist yet.
    argocd.argoproj.io/hook: PreSync
    #
    # A Job's spec is IMMUTABLE once created — re-applying a changed Job fails
    # with "field is immutable". This deletes the previous Job just before
    # creating the new one, so it can run again on every sync.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Retry the pod at most 3 times before marking the Job Failed.
  backoffLimit: 3

  # Delete the Job (and its pod) 5 minutes after it finishes, so completed
  # migrator pods don't pile up. Remove this if you want to keep the logs.
  ttlSecondsAfterFinished: 300

  template:
    spec:
      # Required for a Job, and it must NOT be "Always" — that would restart
      # the pod after a successful exit and the Job would never complete.
      restartPolicy: OnFailure

      containers:
        - name: migrator
          image: postgres:16-alpine

          envFrom:
            - secretRef:
                name: postgres-credentials

          env:
            # psql reads the password from PGPASSWORD, so it is never passed
            # on the command line where it would appear in `ps` output.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

          command:
            - sh
            - -c
            - |
              set -e

              # Wait for postgres. The Job can start before the database is
              # reachable, and failing here would burn a backoffLimit retry.
              until pg_isready -h postgres -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done

              echo "applying schema"

              # IF NOT EXISTS everywhere: this Job runs again on every sync, so
              # it MUST be idempotent. A migration that fails when re-run is a
              # migration that breaks your deploys.
              psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS documents (
                  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                  filename    text        NOT NULL,
                  size_bytes  bigint      NOT NULL,
                  uploaded_at timestamptz NOT NULL DEFAULT now(),
                  scanned     boolean     NOT NULL DEFAULT false
              );

              -- Append-only access trail. Item 10 in PROJECT-DESIGN, and the
              -- CPS 234 evidence requirement.
              CREATE TABLE IF NOT EXISTS audit_log (
                  id          bigserial PRIMARY KEY,
                  occurred_at timestamptz NOT NULL DEFAULT now(),
                  actor       text        NOT NULL,
                  action      text        NOT NULL,
                  document_id uuid        REFERENCES documents(id)
              );

              CREATE INDEX IF NOT EXISTS idx_audit_log_occurred_at
                  ON audit_log (occurred_at DESC);
              SQL

              echo "schema applied"
