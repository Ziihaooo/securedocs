# ---------------------------------------------------------------------------
# Build, push, and hand over to ArgoCD.
#
# This is the piece that was missing: everything until now was CD. CI produces
# an image and a git commit; it never talks to the cluster, holds no
# kubeconfig, and needs no Kubernetes permissions at all.
#
#   build -> push to ECR -> write the tag into values-eks.yaml -> commit
#                                                                    |
#                                          ArgoCD notices and deploys ┘
#
# The last step is what makes this GitOps rather than a deploy script.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [argocd]
    paths:
      # Only rebuild when something that lands in the image changes. Editing a
      # runbook or a Terraform file must not produce a new image tag.
      - "src/**"
      - ".github/workflows/ci.yml"

# Two jobs must never race to push the same tag or commit to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: securedocs-api
  # Not a secret: useless to anyone whose OIDC token does not say this exact
  # repo and branch. Keeping it visible makes the failure debuggable - GitHub
  # masks secret values in logs, so a wrong ARN in a secret prints as "***".
  AWS_ROLE_ARN: arn:aws:iam::920042984462:role/securedocs-dev-github-actions

jobs:
  build:
    runs-on: ubuntu-latest

    # Least privilege, GitHub side. The default is read-only; each line below
    # is a deliberate grant.
    permissions:
      id-token: write   # REQUIRED to mint the OIDC token. Without it the
                        # AWS step fails with "Credentials could not be loaded"
                        # and never explains why.
      contents: write   # to commit the new tag back to the branch

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The write-back below rebases onto the remote, which a
          # shallow clone (the default, fetch-depth 1) cannot do.
          fetch-depth: 0

      # No access key anywhere. GitHub mints a signed token describing this
      # exact repo and branch; AWS checks it against the role's trust policy
      # and returns credentials valid for one hour.
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The commit SHA, not a hand-written version. Immutable, traceable back
      # to one commit, and impossible to forget to bump. The ECR repository is
      # set to IMMUTABLE tags, so a tag can never be overwritten.
      - name: Compute the image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" src/api

      # BETWEEN build and push, deliberately.
      #
      # ECR already scans on push - but by then the image is in the registry
      # and this workflow has gone green. Scanning here means a bad image is
      # never stored at all.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

          # Only the two severities worth a human's attention. LOW and MEDIUM
          # on a base image number in the dozens and are mostly unreachable
          # from your code - report them and people stop reading the output.
          severity: HIGH,CRITICAL

          # Findings with no fix available yet. You cannot act on them, so
          # failing on them only teaches people to ignore the scanner.
          ignore-unfixed: true

          # Report, do not block - for now. Same reasoning as Checkov: read the
          # list first, then decide what blocking should mean.
          exit-code: "0"

      - name: Push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"

      # The handover. CI does not deploy - it changes the desired state in git
      # and stops. ArgoCD reconciles from there.
      - name: Write the new tag into values-eks.yaml
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          sed -i "s|^    tag: .*|    tag: $TAG|" charts/securedocs/values-eks.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/securedocs/values-eks.yaml

          # Nothing to do if the tag is unchanged - a re-run of the same commit.
          git diff --staged --quiet && exit 0

          # [skip ci] stops this commit from triggering this workflow again.
          # Without it the push loops forever: build -> commit -> build.
          git commit -m "ci: image ${TAG} [skip ci]"

          # The branch may have moved while this build was running - someone
          # pushed, or this is a re-run of an older commit. A plain push is then
          # rejected as a non-fast-forward. Rebase onto whatever is there now
          # and retry; the only change being carried is one line of YAML, so
          # there is nothing to conflict with.
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" \
              && git push origin "HEAD:$BRANCH" \
              && exit 0
            echo "push race, retrying ($attempt/3)"
            sleep 5
          done

          echo "could not push after 3 attempts"
          exit 1
