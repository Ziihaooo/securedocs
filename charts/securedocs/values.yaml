# Default values. Equivalent to defaults in variables.tf.
#
# Anything here can be overridden per environment:
#   helm install securedocs . -f values-kind.yaml   (local kind cluster)
#   helm install securedocs . -f values-eks.yaml    (AWS EKS cluster)
#
# Helm MERGES the override on top of these — an override file only needs the
# keys that differ, not a full copy. (Unlike tfvars, where every required
# variable must be supplied.)

# ── web: nginx serving the landing page ─────────────────────────────────────
web:
  replicas: 3
  image:
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── api: the .NET application ───────────────────────────────────────────────
api:
  replicas: 2
  image:
    repository: securedocs-api
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Startup budget = periodSeconds x failureThreshold.
  # Exposed as a value because a cold start on EKS is slower than on kind.
  startupProbe:
    periodSeconds: 2
    failureThreshold: 30

# ── postgres ────────────────────────────────────────────────────────────────
postgres:
  image:
    repository: postgres
    tag: 16-alpine
  storage: 1Gi
  # Which StorageClass the PVC asks for. Differs per cluster:
  #   kind  "standard"  (rancher local-path, installed by kind)
  #   EKS   "gp3"       (created in infra/l1/ebs-csi.tf)
  # Empty means "use the cluster default" — set it per environment instead,
  # so which disk you got is readable from the chart rather than from cluster
  # state. Same pattern as ingress.className.
  storageClass: ""
  # requests == limits -> Guaranteed QoS. Set both from one value so they can
  # never accidentally drift apart and silently downgrade to Burstable.
  resources:
    cpu: 100m
    memory: 256Mi
  # The Secret is created out-of-band with kubectl and is NOT in git.
  # The chart only references it by name.
  existingSecret: postgres-credentials

# ── external secrets ────────────────────────────────────────────────────────
# Off by default. kind has no ESO and no AWS, so the Secret is created by hand
# there. EKS turns this on and the Secret builds itself from Secrets Manager.
externalSecrets:
  enabled: false
  region: ap-southeast-2
  namespace: external-secrets
  serviceAccount: external-secrets
  # The name of the secret in AWS Secrets Manager (not the Kubernetes Secret).
  secretName: securedocs/dev/postgres

# ── cert-manager ────────────────────────────────────────────────────────────
# Off by default. kind has no public IP, so Let's Encrypt can never reach it to
# validate — the site stays HTTP there. EKS turns this on.
certManager:
  enabled: false
  # Expiry warnings go here. Required when enabled.
  email: ""
  # Which ClusterIssuer the Ingress asks for.
  #   letsencrypt-staging  untrusted cert, loose rate limits — use while testing
  #   letsencrypt-prod     real cert, 5 per week per hostname
  issuer: letsencrypt-staging

# ── shared ──────────────────────────────────────────────────────────────────
ingress:
  className: nginx
  # Empty means the Ingress matches ANY hostname — how it has worked so far,
  # fine when you reach it through a port-forward or /etc/hosts.
  #
  # TLS needs a real one: a certificate is issued FOR a name, and the browser
  # checks the name it typed against the name in the cert.
  host: ""
