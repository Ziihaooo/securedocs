# ---------------------------------------------------------------------------
# The api's identity inside the cluster.
#
# Every pod already runs as SOME ServiceAccount - until now yours ran as
# "default", which is what you get by not choosing. That one has no annotation,
# so its token buys nothing outside the cluster.
#
# What makes this one different is a single annotation. EKS watches for it and,
# when a pod uses this ServiceAccount, injects two environment variables and a
# short-lived signed token file. The AWS SDK finds them without being told.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  # Must match the :sub condition in the IAM trust policy EXACTLY:
  #   system:serviceaccount:default:api
  # A typo here is an AccessDenied with no explanation of which half was wrong.
  name: api
{{- if .Values.api.serviceAccount.roleArn }}
  annotations:
    # Read by the EKS Pod Identity Webhook, nothing else. On kind this value is
    # empty, the annotation disappears, and the ServiceAccount is just a plain
    # identity - the chart still renders and still runs.
    eks.amazonaws.com/role-arn: {{ .Values.api.serviceAccount.roleArn }}
{{- end }}
