apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  # Headless — no virtual IP. Gives each StatefulSet pod a stable DNS name:
  #   postgres-0.postgres.default.svc.cluster.local
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
