{{- if .Values.externalSecrets.enabled }}
# ---------------------------------------------------------------------------
# Only rendered on clusters that have External Secrets Operator installed.
#
# kind has no ESO and no AWS, so there `externalSecrets.enabled: false` and the
# Secret is still created by hand with kubectl. Same chart, both clusters.
# ---------------------------------------------------------------------------

# A SecretStore says HOW to reach a secret backend. It holds no secrets itself —
# just an address and an authentication method.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        # No credentials here. ESO's pod authenticates with IRSA, using the
        # ServiceAccount annotated in infra/l1/external-secrets.tf.
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount }}
            namespace: {{ .Values.externalSecrets.namespace }}
---
# An ExternalSecret says WHAT to fetch and what Kubernetes Secret to build
# from it. This is the object that replaces `kubectl create secret`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  # How often to re-read the source. Rotate the password in Secrets Manager and
  # the Kubernetes Secret follows within this window — no redeploy.
  # (Pods holding the old value still need a restart to pick it up.)
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    # The Secret ESO creates. This name must match what the StatefulSet and
    # the api Deployment already reference — postgres-credentials.
    name: postgres-credentials
    creationPolicy: Owner   # ESO owns it: deleted with the ExternalSecret

  # The stored value is one JSON blob:
  #   {"POSTGRES_USER":"...","POSTGRES_PASSWORD":"...","POSTGRES_DB":"..."}
  # Each key becomes a key in the Kubernetes Secret, so `envFrom: secretRef`
  # keeps working unchanged.
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: POSTGRES_DB
{{- end }}
