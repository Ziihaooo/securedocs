# Dev overrides — kind cluster on a laptop.
# Only what differs from values.yaml; everything else is inherited.

web:
  replicas: 1        # 3 is pointless on a single laptop

api:
  replicas: 1

postgres:
  storage: 1Gi
  # kind installs rancher local-path as "standard". Named explicitly for the
  # same reason as EKS: which disk you got should be readable from the chart.
  storageClass: standard

ingress:
  className: nginx
