# EKS (dev cluster) overrides.
#
# Only what differs from values.yaml. Compare its length to the chart: that
# gap is the whole point of Day 6.
#
# NOTE what is NOT here:
#   ingress.className   still "nginx" — the reason we chose ingress-nginx over
#                       the ALB controller, so the same manifests run on AKS
#   probes, QoS, the migrator Job, the initContainer — all unchanged

web:
  replicas: 2          # real nodes now, not one laptop

api:
  replicas: 2

  image:
    # The node pulls from ECR using the node role's
    # AmazonEC2ContainerRegistryReadOnly permission. No imagePullSecret needed.
    #
    # `kind load docker-image` does not exist here — the image must genuinely
    # be pushed to a registry the cluster can reach.
    repository: 920042984462.dkr.ecr.ap-southeast-2.amazonaws.com/securedocs-api

    # A REAL version, not "dev". The ECR repo is set to IMMUTABLE tags, so a
    # tag can never be overwritten — v0.1.0 always means the same bytes.
    # That is also what cosign signs in Week 3.
    tag: v0.1.0

    # Default for a non-":latest" tag, stated explicitly so it cannot change
    # meaning if the tag ever becomes ":latest".
    pullPolicy: IfNotPresent

  # Created in infra/l1/api-irsa.tf. Predictable from the cluster name, so it
  # survives every rebuild — unlike ingress.host below, this is written once.
  # Confirm with: terraform output api_role_arn
  serviceAccount:
    roleArn: arn:aws:iam::920042984462:role/securedocs-dev-api

  # EKS cold start is slower than kind: bigger network hop, cold page cache.
  # 2s x 45 = 90s budget instead of 60.
  startupProbe:
    periodSeconds: 2
    failureThreshold: 45

postgres:
  # Created in infra/l1/ebs-csi.tf. gp3: 3000 IOPS at any size, ~20% cheaper
  # per GB than the gp2 EKS ships as default.
  storageClass: gp3

  # EBS bills per provisioned GB whether used or not, so this is a real cost
  # decision — unlike kind, where the volume was a folder on disk.
  storage: 5Gi

# External Secrets Operator is installed on this cluster (infra/l1), so the
# postgres-credentials Secret builds itself from AWS Secrets Manager.
# That removes the last manual step: no `kubectl create secret` after a rebuild.
externalSecrets:
  enabled: true
  secretName: securedocs/dev/postgres

# cert-manager is installed on this cluster (infra/l1/cert-manager.tf), and the
# NLB gives it a public address Let's Encrypt can actually reach.
certManager:
  enabled: true

  # Left empty on purpose — the template omits the field entirely when unset.
  # ACME registers an account fine without a contact, and Let's Encrypt stopped
  # sending expiry reminders in 2025, so filling this in would achieve little
  # beyond publishing an address in a public repo.
  #
  # Set it if you ever want CA notices — a throwaway address, not your main one.
  email: ""

  # Start on staging: prove the whole chain works (DNS -> HTTP-01 challenge ->
  # cert in a Secret -> nginx serving it) while a mistake costs nothing.
  # Flip to letsencrypt-prod once the browser warning is the ONLY thing wrong.
  issuer: letsencrypt-prod

ingress:
  className: nginx

  # The public hostname. Changes on every rebuild, because a destroyed NLB
  # comes back with new IPs:
  #
  #   terraform output nlb_hostname     -> k8s-....elb.amazonaws.com
  #   dig +short <that>                 -> 13.211.44.8
  #   host = 13.211.44.8.sslip.io
  #
  # sslip.io resolves any IP embedded in a name straight back to that IP, so
  # there is no DNS record to create anywhere. The cost is this line moving
  # each rebuild — which an Elastic IP would fix for ~$7/month.
  host: 3.25.10.250.sslip.io
