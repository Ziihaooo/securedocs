# Production overrides — EKS.
# Compare the size of this file to the chart: that difference is the point.

web:
  replicas: 3
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

api:
  replicas: 4
  # Must be a real, immutable tag. NEVER :dev or :latest in production —
  # you cannot tell what actually ran, and a rollback has nothing to roll back to.
  image:
    repository: 123456789012.dkr.ecr.ap-southeast-2.amazonaws.com/securedocs-api
    tag: v0.1.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Cold start on EKS is slower than on a laptop: bigger images, real network,
  # cold page cache. 2s x 60 = 120s.
  startupProbe:
    periodSeconds: 2
    failureThreshold: 60

postgres:
  storage: 100Gi
  resources:
    cpu: 1000m
    memory: 4Gi

ingress:
  # The AWS Load Balancer Controller turns this Ingress into a real ALB.
  # Same template, different controller reading it.
  className: alb
